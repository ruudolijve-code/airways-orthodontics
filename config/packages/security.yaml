security:
    # Password hashing
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Users worden geladen uit de database via de User-entity
    providers:
        app_user_provider:
            entity:
                class: App\Security\Entity\User
                property: email

    firewalls:
        dev:
            # Profiler en frontend assets blijven buiten de beveiliging
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: admin

            logout:
                path: app_logout
                target: home

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Alleen de eerste passende regel wordt toegepast
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/8f4a9c_admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Lagere kosten tijdens tests voor snellere testuitvoering
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10